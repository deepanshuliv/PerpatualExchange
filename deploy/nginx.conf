# Gateway for the perp Compose project. Host Caddy terminates TLS and proxies
# to 127.0.0.1:8090, which Compose maps to this server's port 80.

# Re-resolve service names so a recreated container's new IP is picked up
# instead of returning 502 (shared VM plan, section 6 item 2).
resolver 127.0.0.11 valid=1s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream perp_backend {
    zone perp_backend 64k;
    server backend:3001 resolve;
}

upstream perp_ws {
    zone perp_ws 64k;
    server ws:8080 resolve;
}

upstream perp_frontend {
    zone perp_frontend 64k;
    server frontend:3000 resolve;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    # Express routes are rooted at /, so strip the /api prefix.
    location = /api {
        proxy_pass http://perp_backend/;
    }

    location /api/ {
        proxy_pass http://perp_backend/;
    }

    # A location with its own proxy_set_header inherits none from the server
    # block, so the forwarding headers are repeated here.
    location /ws {
        proxy_pass http://perp_ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://perp_frontend;
    }
}
