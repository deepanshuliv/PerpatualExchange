x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: perp-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: perp-redis
    restart: unless-stopped
    logging: *default-logging
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
      --save 60 1
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perp-engine
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "apps/engine/index.ts"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - ENGINE_STREAM=to-engine
      - BACKEND_STREAM=to-backend
      - SNAPSHOT_DIR=/app/apps/engine/snapshots
      - ENGINE_MAX_IN_MEMORY_FILLS=${ENGINE_MAX_IN_MEMORY_FILLS:-100000}
      - ENGINE_MAX_OPEN_ORDERS=${ENGINE_MAX_OPEN_ORDERS:-100000}
      - R2_ENDPOINT=${R2_ENDPOINT:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-perp-exchange-snapshots}
      - BINANCE_STREAM_URL=wss://stream.binancefuture.com/stream?streams=btcusdt@markPrice@1s/solusdt@markPrice@1s/ethusdt@markPrice@1s
    volumes:
      - engine_snapshots:/app/apps/engine/snapshots

  db-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perp-db-consumer
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "apps/db/index.ts"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379
      - BACKEND_STREAM=to-backend
      - DB_CONSUMER_GROUP=db-consumer-group
      - DB_CONSUMER_NAME=db-consumer
      - HISTORY_RETENTION_DAYS=${HISTORY_RETENTION_DAYS:-90}

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perp-backend
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "apps/backend/index.ts"]
    depends_on:
      - engine
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-postgres}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://exchange.deepanshu.live,http://localhost:3000,http://127.0.0.1:3000}
      - ENGINE_STREAM=to-engine
      - BACKEND_STREAM=to-backend
      - BACKEND_MAX_PENDING_REQUESTS=${BACKEND_MAX_PENDING_REQUESTS:-10000}
      - PORT=3001
      - HOST=0.0.0.0

  ws:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perp-ws
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "apps/ws/index.ts"]
    depends_on:
      - engine
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - BACKEND_STREAM=to-backend
      - WS_CONSUMER_GROUP=ws-group
      - WS_CONSUMER_NAME=ws
      - WS_MAX_CLIENTS=${WS_MAX_CLIENTS:-1000}
      - WS_MAX_BUFFERED_BYTES=${WS_MAX_BUFFERED_BYTES:-4194304}
      - PORT=8080
      - HOST=0.0.0.0

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://exchange.deepanshu.live/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://exchange.deepanshu.live/ws}
    container_name: perp-frontend
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "run", "start"]
    working_dir: /app/apps/frontend
    depends_on:
      - backend
      - ws
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0

  market-maker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perp-market-maker
    restart: unless-stopped
    logging: *default-logging
    command: ["bun", "apps/market-maker/index.ts"]
    depends_on:
      - engine
      - redis
    environment:
      - REDIS_URL=redis://redis:6379
      - ENGINE_STREAM=to-engine
      - BACKEND_STREAM=to-backend
      - MM_INITIAL_BALANCE=1000000
      - MM_MIN_BALANCE=100000
      - MM_REQUOTE_INTERVAL_MS=1000

  caddy:
    image: caddy:2-alpine
    container_name: perp-caddy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - ws
      - frontend

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  engine_snapshots:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
