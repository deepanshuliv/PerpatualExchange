# Production stack for the shared GCP VM (see /opt/apps/DEPLOYMENT.md there).
# Always run with the project name:
#   flock /opt/apps/.build.lock docker compose -p perp -f docker-compose.prod.yml up -d --build
# Secrets come from .env next to this file (mode 600, never committed).
# Only the nginx gateway publishes a port, on 127.0.0.1:${GATEWAY_PORT}.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.prod
    args:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
  image: perp-app:latest
  restart: unless-stopped
  logging: *logging

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    restart: unless-stopped
    logging: *logging
    mem_limit: 896m
    shm_size: 256m
    command: >-
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c max_wal_size=512MB
      -c min_wal_size=80MB
      -c max_connections=60
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Memory is the hard cap and the disk footprint follows it: one RDB plus an
  # AOF that is rewritten when it doubles. Every stream is trimmed to ~100k
  # entries by the producers, so normal use stays well below the cap.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    command: >-
      redis-server
      --maxmemory ${REDIS_MAXMEMORY:-512mb}
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --aof-use-rdb-preamble yes
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 32mb
      --save 300 1
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    restart: "no"
    working_dir: /app/packages/db
    command: ["bun", "run", "prisma", "migrate", "deploy"]
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *database-url

  engine:
    <<: *app
    command: ["bun", "apps/engine/index.ts"]
    mem_limit: 512m
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379
      ENGINE_STREAM: to-engine
      BACKEND_STREAM: to-backend
      SNAPSHOT_DIR: /app/apps/engine/snapshots
      ENGINE_MAX_IN_MEMORY_FILLS: ${ENGINE_MAX_IN_MEMORY_FILLS:-100000}
      ENGINE_MAX_OPEN_ORDERS: ${ENGINE_MAX_OPEN_ORDERS:-100000}
      BINANCE_STREAM_URL: ${BINANCE_STREAM_URL:?set BINANCE_STREAM_URL in .env}
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME in .env}
    volumes:
      - engine-snapshots:/app/apps/engine/snapshots

  db-consumer:
    <<: *app
    command: ["bun", "apps/db/index.ts"]
    mem_limit: 320m
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *database-url
      REDIS_URL: redis://redis:6379
      BACKEND_STREAM: to-backend
      DB_CONSUMER_GROUP: db-consumer-group
      DB_CONSUMER_NAME: db-consumer
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}

  backend:
    <<: *app
    command: ["bun", "apps/backend/index.ts"]
    mem_limit: 320m
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      engine:
        condition: service_started
    environment:
      <<: *database-url
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ENABLE_SIM_ROUTES: ${ENABLE_SIM_ROUTES:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS in .env}
      ENGINE_STREAM: to-engine
      BACKEND_STREAM: to-backend
      BACKEND_MAX_PENDING_REQUESTS: ${BACKEND_MAX_PENDING_REQUESTS:-10000}
      PORT: "3001"
      HOST: 0.0.0.0

  ws:
    <<: *app
    command: ["bun", "apps/ws/index.ts"]
    mem_limit: 256m
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_STREAM: to-backend
      WS_CONSUMER_GROUP: ws-group
      WS_CONSUMER_NAME: ws
      WS_MAX_CLIENTS: ${WS_MAX_CLIENTS:-1000}
      WS_MAX_BUFFERED_BYTES: ${WS_MAX_BUFFERED_BYTES:-4194304}
      PORT: "8080"
      HOST: 0.0.0.0

  market-maker:
    <<: *app
    command: ["bun", "apps/market-maker/index.ts"]
    mem_limit: 192m
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    environment:
      REDIS_URL: redis://redis:6379
      ENGINE_STREAM: to-engine
      BACKEND_STREAM: to-backend
      MM_INITIAL_BALANCE: ${MM_INITIAL_BALANCE:-1000000}
      MM_MIN_BALANCE: ${MM_MIN_BALANCE:-100000}
      MM_REQUOTE_INTERVAL_MS: ${MM_REQUOTE_INTERVAL_MS:-1000}

  frontend:
    <<: *app
    command: ["bun", "run", "start"]
    working_dir: /app/apps/frontend
    mem_limit: 512m
    depends_on:
      - backend
      - ws
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0

  archiver:
    build:
      context: deploy/archiver
    image: perp-archiver:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      R2_BUCKET: ${R2_BUCKET_NAME:?set R2_BUCKET_NAME in .env}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT in .env}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID in .env}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY in .env}
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}
      ARCHIVE_BACKFILL_DAYS: ${ARCHIVE_BACKFILL_DAYS:-25}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      DISK_WARN_PERCENT: ${DISK_WARN_PERCENT:-80}

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8090}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - ws
      - frontend

volumes:
  postgres-data:
  redis-data:
  engine-snapshots:
